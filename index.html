<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon premier site GitHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        .contenu {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        .bouton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>bienvenue sur mon site, voici j'ajoute un truc</h1>
        <p>Mon premier projet avec GitHub puis j'ajoute une branche </p>
    </header>

    <div class="contenu">
        <h2>Mon projet</h2>

        <p>
            Je suis en train d'apprendre à utiliser GitHub,
            à gérer des fichiers et à construire des projets.
        </p>

        <a href="#" class="bouton">Mon bouton</a>
    </div>

    <footer>
        <p>Créé avec GitHub</p>
    </footer>

</body>

  </html>
